# Optional static-file snippet. DramaFlash production web uses Expo
# `web.output: "server"` and `npx expo serve` (see Dockerfile). Do not point
# nginx at `dist/` for the current export: that tree has client and server
# folders and no prerendered index.html.
#
# Keep this file only if you later switch to `web.output: "static"` and serve
# the resulting HTML from a static host.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
